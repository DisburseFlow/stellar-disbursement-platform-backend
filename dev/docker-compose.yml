version: '3.8'
services:
  db:
    extends:
      file: docker-compose-sdp.yml
      service: db
  sdp-api:
    extends:
      file: docker-compose-sdp.yml
      service: sdp-api
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
  sdp-tss:
    extends:
      file: docker-compose-tss.yml
      service: sdp-tss
    depends_on:
      db:
        condition: service_healthy
      sdp-api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
  sdp-frontend:
    extends:
      file: docker-compose-frontend.yml
      service: sdp-frontend
    depends_on:
      - db
      - sdp-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
  demo-wallet:
    extends:
      file: docker-compose-sdp.yml
      service: demo-wallet

volumes:
  postgres-db:
    name: ${COMPOSE_PROJECT_NAME:-sdp}_postgres-db-${NETWORK_TYPE:-testnet}
    driver: local